[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "next-word-predictor"
version = "1.0.0"
description = "AI-powered next word prediction using LSTM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Flask==2.3.3",
    "tensorflow-cpu==2.13.0",
    "numpy==1.24.3",
    "gunicorn==21.2.0",
    "Werkzeug==2.3.7",
]
