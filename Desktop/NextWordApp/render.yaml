services:
  - type: web
    name: next-word-predictor
    env: python
    region: oregon
    plan: free
    runtime: python-3.11
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:${PORT:-5000} --workers 1 --timeout 120 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        sync: false
